<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Intelligence</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        video {
            width: 100%;
            margin-top: 30px;
        }

        .result {
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .result:hover {
            background: #f5f5f5;
        }

        .timestamp {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>AI Video Intelligence</h1>

    <input
        id="searchInput"
        type="text"
        placeholder="Search your videos..."
    >

    <button onclick="searchVideos()">Search</button>

    <div id="results"></div>

    <video id="videoPlayer" controls></video>

    <script>

        const API_BASE_URL = "http://localhost:8000";

        async function searchVideos() {

            const query = document.getElementById("searchInput").value.trim();

            if (!query) {
                return;
            }

            const response = await fetch(
                `${API_BASE_URL}/api/videos/semantic-search?q=${encodeURIComponent(query)}`
            );

            const data = await response.json();

            displayResults(data.results);
        }


        function displayResults(results) {

            const resultsContainer = document.getElementById("results");

            resultsContainer.innerHTML = "";

            if (results.length === 0) {
                resultsContainer.innerHTML = "<p>No results found.</p>";
                return;
            }

            results.forEach(result => {

                const resultElement = document.createElement("div");

                resultElement.className = "result";

                resultElement.innerHTML = `
                    <div class="timestamp">
                        ${result.start_timestamp} → ${result.end_timestamp}
                    </div>

                    <div>
                        ${result.text}
                    </div>

                    <small>
                        ${result.filename}
                    </small>
                `;

                resultElement.onclick = () => {
                    playAtTimestamp(result);
                };

                resultsContainer.appendChild(resultElement);
            });
        }


        function playAtTimestamp(result) {

            const videoPlayer = document.getElementById("videoPlayer");

            videoPlayer.src = API_BASE_URL + result.video_url;

            videoPlayer.addEventListener(
                "loadedmetadata",
                function () {

                    videoPlayer.currentTime = result.start_time;

                    videoPlayer.play();

                },
                { once: true }
            );
        }

    </script>

</body>
</html>
